<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KalyPOS — Iniciar Sesión</title>
  <meta name="description" content="Sistema de Punto de Venta para Venezuela con tasa BCV actualizada diariamente">
  <link rel="stylesheet" href="css/login.css?v=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="js/theme.js?v=1.0"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#198754">
  <link rel="apple-touch-icon" href="img/icon.svg">
</head>

<body>
  <div class="login-page">
    <!-- Background pattern -->
    <div class="login-bg-pattern"></div>

    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-k">
          <img src="img/iconos.png" alt="KalyPOS" class="logo-img">
        </div>
        <h1 class="brand-name"><span class="brand-kaly">Kaly</span><span class="brand-pos">POS</span></h1>
        <p class="brand-slogan">Tu negocio en constante flujo</p>
      </div>

      <!-- Error message -->
      <div class="login-error" id="login-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="login-error-msg">Credenciales incorrectas</span>
      </div>

      <!-- Login Form -->
      <form class="login-form" id="login-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="username">
            <i class="fa-solid fa-user"></i> Usuario
          </label>
          <input id="username" name="username" type="text" class="form-control" placeholder="Ingresa tu usuario"
            autocomplete="username" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <i class="fa-solid fa-lock"></i> Contraseña
          </label>
          <div class="password-wrapper">
            <input id="password" name="password" type="password" class="form-control"
              placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            <button type="button" id="toggle-pwd" class="toggle-password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-login" id="login-btn">
          <i class="fa-solid fa-right-to-bracket"></i>
          Iniciar Sesión
        </button>

        <div style="text-align:center;margin-top:0.75rem;">
          <a href="/forgot-password.html" style="font-size:0.78rem;color:#6D6D6D;text-decoration:none;">
            <i class="fa-solid fa-key" style="font-size:0.72rem;"></i> ¿Olvidaste tu contraseña?
          </a>
        </div>
      </form>

      <!-- Register + Trial -->
      <div class="login-footer">
        <p class="register-text">
          No tienes cuenta? <a href="/register.html" class="register-link">Regístrate gratis</a>
        </p>
        <p class="demo-text">
          <i class="fa-solid fa-gift"></i>
          7 días de demo con acceso completo
        </p>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/config.js?v=1.0"></script>
  <script src="js/api.js?v=1.1"></script>
  <script src="js/keyboard.js?v=1.0"></script>
  <script>
    // Redirect if already logged in
    if (isLoggedIn()) {
      const u = getUser();
      window.location.href = u.role === 'superadmin' ? '/superadmin.html' : '/pos.html';
    }

    const form = document.getElementById('login-form');
    const errBox = document.getElementById('login-error');
    const errMsg = document.getElementById('login-error-msg');
    const loginBtn = document.getElementById('login-btn');
    const pwdInput = document.getElementById('password');
    const togglePwd = document.getElementById('toggle-pwd');

    togglePwd.addEventListener('click', () => {
      const isText = pwdInput.type === 'text';
      pwdInput.type = isText ? 'password' : 'text';
      togglePwd.innerHTML = isText
        ? '<i class="fa-solid fa-eye"></i>'
        : '<i class="fa-solid fa-eye-slash"></i>';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner"></span> Iniciando...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await api.post('/auth/login', { username, password });
        saveSession(data.token, data.user);

        // Store trial info for dashboard banner
        if (data.company_status) {
          localStorage.setItem('pos_company_status', data.company_status);
          localStorage.setItem('pos_trial_days', data.trial_days_left ?? '');
        }

        let welcomeMsg = `¡Bienvenido, ${data.user.name}!`;
        if (data.company_status === 'pending' && data.trial_days_left !== null) {
          welcomeMsg += ` (Demo: ${data.trial_days_left} dias restantes)`;
        }
        showToast(welcomeMsg, 'success', 2000);
        setTimeout(() => {
          window.location.href = data.user.role === 'superadmin' ? '/superadmin.html' : '/pos.html';
        }, 600);
      } catch (err) {
        errMsg.textContent = err.message;
        errBox.style.display = 'flex';
        errBox.style.gap = '0.5rem';
        errBox.style.alignItems = 'center';
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión';
      }
    });
  </script>
</body>

</html>
