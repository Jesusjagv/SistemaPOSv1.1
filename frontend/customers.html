<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Sistema POS</title>
  <link rel="stylesheet" href="css/main.css?v=1.0">
  <link rel="stylesheet" href="css/dashboard.css?v=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="js/theme.js?v=1.0"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B2545">
  <link rel="apple-touch-icon" href="img/icon.svg">
</head>

<body>
  <div class="sidebar-overlay" onclick="closeSidebar()"></div>

  <div class="app-shell">
    <header class="app-header">
      <button class="menu-toggle" id="menu-toggle" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="app-logo">
        <div class="logo-icon">🏪</div><span>KalyPOS</span>
      </div>
      <div class="bcv-badge"><span class="bcv-flag">🇻🇪</span><span>BCV: 1$ = <strong id="bcv-rate">--</strong>
          Bs</span>
        <div class="bcv-pulse"></div>
      </div>
      <div class="header-spacer"></div>

      <button class="btn btn-ghost btn-sm" onclick="toggleTheme()" title="Cambiar tema"
        style="margin-right:0.5rem;border-radius:50%;width:32px;height:32px;padding:0;">
        <i id="theme-icon" class="fa-solid fa-moon"></i>
      </button>

      <nav class="header-nav-desktop" style="display:flex;gap:0.25rem;">
        <a href="/pos.html" class="nav-item" style="padding:0.4rem 0.7rem;margin:0;font-size:0.78rem;"><i
            class="fa-solid fa-cash-register"></i> POS</a>
        <a href="/products.html" class="nav-item" style="padding:0.4rem 0.7rem;margin:0;font-size:0.78rem;"><i
            class="fa-solid fa-boxes-stacked"></i> Inventario</a>
        <a href="/customers.html" class="nav-item active" style="padding:0.4rem 0.7rem;margin:0;font-size:0.78rem;"><i
            class="fa-solid fa-users"></i> Clientes</a>
        <a href="/reports.html" class="nav-item" style="padding:0.4rem 0.7rem;margin:0;font-size:0.78rem;"><i
            class="fa-solid fa-chart-bar"></i> Reportes</a>
        <a href="/debts.html" class="nav-item" style="padding:0.4rem 0.7rem;margin:0;font-size:0.78rem;"><i
            class="fa-solid fa-hand-holding-dollar"></i> Fiados</a>
        <a href="/cash-sessions.html" class="nav-item"
          style="padding:0.4rem 0.7rem;margin:0;font-size:0.78rem;border-left:2px solid var(--emerald);background:rgba(16,185,129,0.08);"><i
            class="fa-solid fa-cash-register" style="color:var(--emerald-light);"></i> Caja</a>
      </nav>

      <div class="header-user" onclick="toggleUserDropdown(event)" style="cursor:pointer; position:relative;">
        <div class="user-avatar" id="user-avatar">A</div>
        <div class="user-info-text">
          <div id="user-name" style="font-weight:600;font-size:0.8rem;"></div>
          <div class="user-role" id="user-role"></div>
        </div>
        <i class="fa-solid fa-chevron-down"
          style="font-size:0.75rem; margin-left:0.25rem; color:rgba(255,255,255,0.6);"></i>
        <!-- Dropdown -->
        <div id="user-dropdown" class="user-dropdown hidden">
          <a href="/settings.html" class="dropdown-item"><i class="fa-solid fa-gear"></i> Configuración</a>
          <div class="dropdown-divider"></div>
          <a href="#" class="dropdown-item text-danger" onclick="logout()"><i
              class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a>
        </div>
      </div>
    </header>
    <nav class="app-nav">
      <span class="nav-section-label">Menú</span>
      <a href="/pos.html" class="nav-item"><i class="fa-solid fa-cash-register"></i> POS</a>
      <a href="/products.html" class="nav-item"><i class="fa-solid fa-boxes-stacked"></i> Inventario</a>
      <a href="/customers.html" class="nav-item active"><i class="fa-solid fa-users"></i> Clientes</a>
      <a href="/debts.html" class="nav-item nav-fiados-link"><i class="fa-solid fa-hand-holding-dollar"></i> Fiados</a>
      <a href="/cash-sessions.html" class="nav-item nav-caja-link"><i class="fa-solid fa-cash-register"
          style="color:var(--emerald-light);"></i> Caja</a>
      <a href="/reports.html" class="nav-item"><i class="fa-solid fa-chart-bar"></i> Reportes</a>
    </nav>
    <main class="app-main">
      <div class="page-header">
        <div>
          <div class="page-title"><i class="fa-solid fa-users" style="color:var(--violet-light);"></i> Clientes</div>
          <div class="page-subtitle">Administra la cartera de clientes</div>
        </div>
        <div style="display:flex;gap:0.5rem;">
          <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="search-input" class="search-input" placeholder="Buscar cliente..."
              oninput="searchCustomers(this.value)">
          </div>
          <button class="btn btn-primary" onclick="openCustomerModal()">
            <i class="fa-solid fa-user-plus"></i> Nuevo Cliente
          </button>
        </div>
      </div>

      <div class="stats-grid stats-grid-3">
        <div class="stat-card">
          <span class="stat-watermark"><i class="fa-solid fa-users"></i></span>
          <div class="stat-icon" style="background:rgba(111,66,193,0.12);color:var(--violet-light);"><i
              class="fa-solid fa-users"></i></div>
          <div class="stat-label">Total Clientes</div>
          <div class="stat-value" id="stat-total">--</div>
        </div>
        <div class="stat-card">
          <span class="stat-watermark"><i class="fa-solid fa-id-card"></i></span>
          <div class="stat-icon" style="background:rgba(16,185,129,0.2);color:var(--emerald-light);"><i
              class="fa-solid fa-id-card"></i></div>
          <div class="stat-label">Con Cédula/RIF</div>
          <div class="stat-value" id="stat-withdoc">--</div>
        </div>
        <div class="stat-card">
          <span class="stat-watermark"><i class="fa-solid fa-phone"></i></span>
          <div class="stat-icon" style="background:rgba(14,165,233,0.2);color:#38bdf8;"><i
              class="fa-solid fa-phone"></i></div>
          <div class="stat-label">Con Teléfono</div>
          <div class="stat-value" id="stat-withphone">--</div>
        </div>
      </div>

      <div class="customer-card-grid" id="customer-grid">
        <div class="loading-state">
          <div class="spinner"></div><span>Cargando...</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Customer -->
  <div class="modal-overlay hidden" id="customer-modal" onclick="closeOnOverlayClick(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modal-cust-title"><i class="fa-solid fa-user-plus"
            style="color:var(--violet-light);"></i> Nuevo Cliente</div>
        <button class="btn-close" onclick="closeModal('customer-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="cust-id">
        <div class="form-group">
          <label class="form-label">Nombre completo *</label>
          <input id="cust-name" class="form-control" placeholder="Ej: Juan Pérez">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Tipo de documento</label>
            <select id="cust-doctype" class="form-control">
              <option value="V">V — venezolano</option>
              <option value="E">E — extranjero</option>
              <option value="J">J — empresa (RIF)</option>
              <option value="G">G — gobierno</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Número de documento</label>
            <input id="cust-docnum" class="form-control" placeholder="Ej: 12345678">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input id="cust-phone" class="form-control" type="tel" pattern="[0-9\-\+\s]{7,15}"
            placeholder="Ej: 0414-1234567">
        </div>
        <div class="form-group">
          <label class="form-label">Dirección</label>
          <input id="cust-address" class="form-control" placeholder="Dirección completa">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('customer-modal')">Cancelar</button>
        <button class="btn btn-primary" onclick="saveCustomer()"><i class="fa-solid fa-save"></i> Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal Detail -->
  <div class="modal-overlay hidden" id="detail-modal" onclick="closeOnOverlayClick(event)">
    <div class="modal modal-lg">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-user" style="color:var(--violet-light);"></i> Detalle del Cliente
        </div>
        <button class="btn-close" onclick="closeModal('detail-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="detail-body"></div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/config.js?v=1.0"></script>
  <script src="js/api.js?v=1.1"></script>
  <script src="js/keyboard.js?v=1.0"></script>
  <script src="js/customers.js?v=1.0"></script>
</body>

</html>
