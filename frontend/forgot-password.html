<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KalyPOS — Recuperar Contraseña</title>
  <link rel="stylesheet" href="css/login.css?v=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="js/theme.js?v=1.0"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#198754">
  <link rel="apple-touch-icon" href="img/icon.svg">
</head>

<body>
  <div class="login-page">
    <div class="login-bg-pattern"></div>

    <div class="login-card">
      <div class="login-logo">
        <div class="logo-k">
          <img src="img/iconos.png" alt="KalyPOS" class="logo-img">
        </div>
        <h1 class="brand-name"><span class="brand-kaly">Kaly</span><span class="brand-pos">POS</span></h1>
        <p class="brand-slogan">Recuperar Contraseña</p>
      </div>

      <!-- Error message -->
      <div class="login-error" id="login-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="login-error-msg"></span>
      </div>

      <!-- Step 1: Enter username -->
      <form class="login-form" id="step1-form" autocomplete="on">
        <p style="font-size:0.82rem;color:#666;text-align:center;margin-bottom:0.5rem;">
          Ingresa tu usuario para recuperar tu contraseña.
        </p>

        <div class="form-group">
          <label class="form-label" for="username">
            <i class="fa-solid fa-user"></i> Usuario
          </label>
          <input id="username" name="username" type="text" class="form-control"
            placeholder="Ingresa tu usuario" required>
        </div>

        <button type="submit" class="btn btn-login" id="step1-btn">
          <i class="fa-solid fa-arrow-right"></i>
          Continuar
        </button>
      </form>

      <!-- Step 2: Answer security questions -->
      <form class="login-form" id="step2-form" style="display:none;" autocomplete="on">
        <p style="font-size:0.82rem;color:#666;text-align:center;margin-bottom:0.5rem;">
          Responde tus preguntas de seguridad para restablecer tu contraseña.
        </p>

        <div id="questions-container"></div>

        <div class="form-group">
          <label class="form-label" for="new-password">
            <i class="fa-solid fa-lock"></i> Nueva contraseña
          </label>
          <div class="password-wrapper">
            <input id="new-password" name="new_password" type="password" class="form-control"
              placeholder="Mínimo 6 caracteres" minlength="6" required>
            <button type="button" id="toggle-pwd" class="toggle-password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">
            <i class="fa-solid fa-lock"></i> Confirmar contraseña
          </label>
          <input id="confirm-password" name="confirm_password" type="password" class="form-control"
            placeholder="Repite tu nueva contraseña" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-login" id="step2-btn">
          <i class="fa-solid fa-check"></i>
          Restablecer Contraseña
        </button>
      </form>

      <!-- Step 3: Success -->
      <div id="success-panel" style="display:none;text-align:center;padding:1rem 0;">
        <div style="width:64px;height:64px;background:rgba(25,135,84,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
          <i class="fa-solid fa-check" style="font-size:28px;color:#198754;"></i>
        </div>
        <h3 style="color:#333;margin:0 0 0.5rem;">¡Contraseña Actualizada!</h3>
        <p style="color:#666;font-size:0.85rem;margin:0 0 1.5rem;">Ya puedes iniciar sesión con tu nueva contraseña.</p>
        <a href="/index.html" class="btn btn-login" style="text-decoration:none;display:inline-flex;">
          <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
        </a>
      </div>

      <div class="login-footer">
        <p class="register-text">
          <a href="/index.html" class="register-link"><i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión</a>
        </p>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/config.js?v=1.0"></script>
  <script src="js/api.js?v=1.1"></script>
  <script src="js/keyboard.js?v=1.0"></script>
  <script>
    let userQuestions = [];
    let userUsername = '';

    // Toggle password visibility
    document.getElementById('toggle-pwd').addEventListener('click', () => {
      const inp = document.getElementById('new-password');
      const isText = inp.type === 'text';
      inp.type = isText ? 'password' : 'text';
      document.getElementById('toggle-pwd').innerHTML = isText
        ? '<i class="fa-solid fa-eye"></i>'
        : '<i class="fa-solid fa-eye-slash"></i>';
    });

    // Step 1: Get security questions
    document.getElementById('step1-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';

      const btn = document.getElementById('step1-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Verificando...';

      userUsername = document.getElementById('username').value.trim();

      try {
        const data = await api.post('/auth/forgot-password', { username: userUsername });
        userQuestions = data.questions;

        // Build questions form
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        data.questions.forEach((q, i) => {
          container.innerHTML += `
            <div class="form-group">
              <label class="form-label" for="answer-${i}">
                <i class="fa-solid fa-circle-question"></i> ${q}
              </label>
              <input id="answer-${i}" type="text" class="form-control"
                placeholder="Tu respuesta" required>
            </div>
          `;
        });

        // Show step 2
        document.getElementById('step1-form').style.display = 'none';
        document.getElementById('step2-form').style.display = 'flex';
        showToast(`Hola ${data.name}, responde tus preguntas de seguridad`, 'info');
      } catch (err) {
        errBox.style.display = 'flex';
        document.getElementById('login-error-msg').textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right"></i> Continuar';
      }
    });

    // Step 2: Reset password with answers
    document.getElementById('step2-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';

      const newPwd = document.getElementById('new-password').value;
      const confirmPwd = document.getElementById('confirm-password').value;

      if (newPwd !== confirmPwd) {
        errBox.style.display = 'flex';
        document.getElementById('login-error-msg').textContent = 'Las contraseñas no coinciden';
        return;
      }

      // Collect answers
      const answers = userQuestions.map((_, i) => {
        return document.getElementById(`answer-${i}`).value;
      });

      const btn = document.getElementById('step2-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Restableciendo...';

      try {
        await api.post('/auth/reset-password', {
          username: userUsername,
          answers: answers,
          new_password: newPwd
        });

        showToast('¡Contraseña actualizada exitosamente!', 'success');

        // Show success panel
        document.getElementById('step2-form').style.display = 'none';
        document.getElementById('success-panel').style.display = 'block';
      } catch (err) {
        errBox.style.display = 'flex';
        document.getElementById('login-error-msg').textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Restablecer Contraseña';
      }
    });
  </script>
</body>

</html>
